[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-vm-mail-platform"
version = "1.0.0"
description = "IaC for a single-VM mail platform: Postfix + Dovecot + OpenDKIM + mailbox panel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Shield-1.0.0" }
authors = [{ name = "Eugene Grossbart", email = "eugene@piniq.ai" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<10", "PyYAML>=6.0", "Jinja2>=3.1"]

[project.scripts]
ops = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, no network",
  "service: compose, ansible, terraform, shellcheck",
]
