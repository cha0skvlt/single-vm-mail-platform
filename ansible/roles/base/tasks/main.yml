---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Full system upgrade
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
  when: upgrade_packages | bool
  tags:
    - upgrade_packages

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - htop
      - rsyslog
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Set ufw default policies
  ansible.builtin.command:
    cmd: "ufw default {{ item.policy }} {{ item.direction }}"
  loop:
    - { policy: deny, direction: incoming }
    - { policy: allow, direction: outgoing }
  changed_when: false

- name: Allow public TCP services through ufw
  ansible.builtin.command:
    cmd: "ufw allow {{ item }}/tcp comment public-access"
  loop: "{{ ufw_allowed_tcp_ports | unique }}"
  register: ufw_allow_rules
  changed_when: ufw_allow_rules.stdout is search('Rule added')
  failed_when: ufw_allow_rules.rc != 0

- name: Allow paired hosts restricted service access through ufw
  when: ufw_allowed_from_hosts | length > 0
  ansible.builtin.command:
    cmd: >-
      ufw allow from {{ item.from }} to any port {{ item.port }}
      proto {{ item.proto }} comment {{ item.comment }}
  loop: "{{ ufw_allowed_from_hosts }}"
  register: ufw_paired_hosts
  changed_when: ufw_paired_hosts.stdout is search('Rule added')
  failed_when: ufw_paired_hosts.rc != 0

- name: Enable ufw
  ansible.builtin.command:
    cmd: ufw --force enable
  register: ufw_enable
  changed_when: ufw_enable.stdout is search('Firewall is active and enabled')
  failed_when: ufw_enable.rc != 0

- name: Set timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Ensure journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap systemd journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-size.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M
  notify: Restart journald

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Enable unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Enable rsyslog service
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started
