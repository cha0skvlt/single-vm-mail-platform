---
- name: Restart node_exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted

- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: Restart mail-metrics
  ansible.builtin.systemd:
    name: mail-metrics
    state: restarted

- name: Restart loki
  ansible.builtin.systemd:
    name: loki
    state: restarted

- name: Restart promtail
  ansible.builtin.systemd:
    name: promtail
    state: restarted
