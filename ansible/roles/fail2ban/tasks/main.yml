---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Install mailpanel-auth filter
  ansible.builtin.copy:
    src: mailpanel-auth.conf
    dest: /etc/fail2ban/filter.d/mailpanel-auth.conf
    mode: "0644"
  notify: Restart fail2ban

- name: Configure fail2ban jails (sshd + postfix + dovecot + panel)
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: restarted
